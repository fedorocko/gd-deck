<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- GoodData brand type: Funnel Display for headlines, Switzer for text -->
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap"
      rel="stylesheet"
    />
    <title>GoodData decks</title>
    <!-- The decks' ground and type (shared/deck.css), cut down to one page. -->
    <style>
      :root {
        --ink: #09090c;
        --line: rgba(255, 255, 255, 0.12);
        --paper: #fafaf7;
        --muted: rgba(250, 250, 247, 0.62);
        --accent: #dafe85;
        --olive: #2b3320;
        --grid: rgba(122, 141, 78, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(32px, 9vw, 120px) clamp(16px, 9vw, 120px);
        color: var(--paper);
        font-family: 'Switzer', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
          linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 160px 160px,
          linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 160px 160px,
          radial-gradient(120% 90% at 50% 0%, var(--olive) 0%, #121410 55%, var(--ink) 100%)
            fixed;
        background-color: var(--ink);
      }

      .eyebrow {
        margin: 0 0 20px;
        color: var(--accent);
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 56px;
        font-family: 'Funnel Display', 'Switzer', Helvetica, Arial, sans-serif;
        font-size: clamp(44px, 8vw, 88px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        max-width: 880px;
        border-top: 1px solid var(--line);
      }

      a {
        display: flex;
        align-items: baseline;
        gap: 24px;
        padding: 28px 0;
        border-bottom: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
      }

      .name {
        font-family: 'Funnel Display', 'Switzer', Helvetica, Arial, sans-serif;
        font-size: clamp(26px, 4vw, 40px);
        font-weight: 500;
      }

      .note {
        flex: 1;
        color: var(--muted);
        font-size: 17px;
      }

      .arrow {
        color: var(--accent);
        font-size: 28px;
        transition: transform 200ms cubic-bezier(0.22, 0.8, 0.3, 1);
      }

      a:hover .arrow,
      a:focus-visible .arrow {
        transform: translateX(6px);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      @media (max-width: 600px) {
        a {
          flex-wrap: wrap;
          gap: 4px 16px;
        }

        .name {
          flex: 1;
        }

        .note {
          order: 3;
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">[ GoodData ]</p>
    <h1>Decks</h1>
    <!-- One row per deck folder; keep in step with DECKS in vite.config.js. -->
    <ul>
      <li>
        <a href="asp-pitch/">
          <span class="name">ASP pitch</span>
          <span class="note">GoodData.AI — the agentic serving plane</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a href="offsite/">
          <span class="name">Offsite</span>
          <span class="note">How AI changes traditional software</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </body>
</html>
