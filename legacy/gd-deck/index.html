<!doctype html>
<!--
  The page for the old address, https://fedorocko.github.io/gd-deck/.
  Not part of this build: it is the whole site of a separate `gd-deck` repo,
  published from its main branch. See "The old /gd-deck/ address" in README.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap"
      rel="stylesheet"
    />
    <title>Moved to /gd-decks</title>
    <style>
      :root {
        --ink: #09090c;
        --paper: #fafaf7;
        --muted: rgba(250, 250, 247, 0.62);
        --accent: #dafe85;
        --olive: #2b3320;
        --grid: rgba(122, 141, 78, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        padding: 32px 16px;
        text-align: center;
        color: var(--paper);
        font-family: 'Switzer', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
          linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 160px 160px,
          linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 160px 160px,
          radial-gradient(120% 90% at 50% 0%, var(--olive) 0%, #121410 55%, var(--ink) 100%)
            fixed;
        background-color: var(--ink);
      }

      h1 {
        margin: 0 0 20px;
        font-family: 'Funnel Display', 'Switzer', Helvetica, Arial, sans-serif;
        font-size: clamp(36px, 7vw, 72px);
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 40px;
        color: var(--muted);
        font-size: 19px;
      }

      a {
        justify-self: center;
        padding: 16px 28px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--ink);
        font-size: 18px;
        font-weight: 500;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <h1>The deck has moved</h1>
    <p>GoodData decks now live under /gd-decks.</p>
    <a href="/gd-decks/">Go to /gd-decks →</a>
  </body>
</html>
